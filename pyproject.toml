[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmhz-converter"
version = "0.1.0"
description = "Lokální prototyp importu a kontroly mzdových dat; bez finálního XML"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "lxml==6.1.3", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[project.scripts]
jmhz-converter = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
